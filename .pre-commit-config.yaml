repos:
  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: daa8297d8c2c2c2c38b7e32a0912debc8969a0dc  # frozen: v3.0.0a5
    hooks:
      - id: pylint

  - repo: https://github.com/psf/black
    rev: af0ba72a73598c76189d6dd1b21d8532255d5942  # frozen: 25.9.0
    hooks:
      - id: black
        language_version: python3.10

  - repo: https://github.com/pycqa/flake8
    rev: d93590f5be797aabb60e3b09f2f52dddb02f349f  # frozen: 7.3.0
    hooks:
      - id: flake8
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 9f70dc58c23dfcca1b97af99eaeee3140a807c7e  # frozen: v1.18.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]

  - repo: https://github.com/adrienverge/yamllint
    rev: 79a6b2b1392eaf49cdd32ac4f14be1a809bbd8f7  # frozen: v1.37.1
    hooks:
      - id: yamllint

  - repo: https://github.com/PyCQA/bandit
    rev: 2d0b675b04c80ae42277e10500db06a0a37bae17  # frozen: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]

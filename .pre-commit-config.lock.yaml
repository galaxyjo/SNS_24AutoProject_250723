meta:
  version: 1
  hook_stage: commit
repos:
  - repo: https://github.com/pre-commit/mirrors-pylint
    rev: 7f1f0e0ea1c1e1a6c91ad1e1e6b7a49e09e02f61
    hooks:
      - id: pylint
        entry: pylint
        language: python
        types: [python]
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        entry: black
        language_version: python3.10
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        entry: flake8
        language: python

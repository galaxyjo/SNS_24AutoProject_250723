name: Quality check

on:
  push:
    branches:
      - main
      - develop
      - "rebuild-*"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pylint mypy flake8 black bandit

      - name: Run black
        run: black --check .

      - name: Run flake8
        run: flake8 .

      - name: Run pylint
        run: pylint modules tools

      - name: Run mypy
        run: mypy modules tools

      - name: Run bandit
        run: bandit -r modules

      # 🔹 .md consistency test는 커버리지 없이 별도 실행
      - name: Run .md consistency test
        run: pytest tests/test_ci_tools/test_generate_manuals.py --tb=short

      # ✅ 전체 테스트 (커버리지 X)
      - name: Run main tests (no coverage)
        run: pytest --tb=short

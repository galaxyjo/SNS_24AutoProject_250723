name: CI Quality Check

on:
  push:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run .md consistency test
        run: |
          pytest tests/test_ci_tools/test_generate_manuals.py --tb=short

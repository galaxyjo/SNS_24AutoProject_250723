---
name: CI Quality Check

"on":
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install pytest-cov   # ✅ 추가: pytest-cov 설치 보장

      - name: Verify pytest-cov is available
        run: |
          python - <<'PY'
          import pkgutil; import sys
          ok = pkgutil.find_loader("pytest_cov") is not None
          print("pytest_cov:", ok)
          sys.exit(0 if ok else 1)
          PY

      - name: Run .md consistency test
        run: |
          pytest tests/test_ci_tools/test_generate_manuals.py --tb=short

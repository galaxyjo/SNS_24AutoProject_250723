name: CI Quality Check
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements-ci.txt

      - name: Sanity check (diagnostic)
        run: |
          python -V
          pip list | grep -E "pytest|cov|yamllint|bandit|mypy" || true
          python - << 'PY'
          import importlib, pytest; print("pytest:", pytest.__version__)
          importlib.import_module("pytest_cov"); print("pytest-cov: OK")
          PY

      - name: Run .md consistency test
        run: |
          pytest tests/test_ci_tools/test_generate_manuals.py --tb=short

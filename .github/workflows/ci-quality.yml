---
name: CI Quality Check

"on":
  workflow_dispatch:
  push:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'scripts/ci_tools/**'
      - 'tests/test_ci_tools/**'
      - 'docs/**'

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ✅ pytest & pytest-cov를 먼저 설치 → 항상 로딩 보장
      - name: Install pytest & pytest-cov
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pytest --version
          pip show pytest-cov

      - name: Install CI dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Verify pytest-cov is available
        run: |
          python - <<'PY'
          import pkgutil, sys
          ok = pkgutil.find_loader("pytest_cov") is not None
          print("pytest-cov found? ", ok)
          if not ok: sys.exit(1)
          PY

      - name: Run test for manuals with coverage
        run: |
          pytest tests/test_ci_tools/test_generate_manuals.py \
            --tb=short \
            --cov=scripts \
            --cov-report=term-missing

      - name: Install project test dependencies
        run: |
          pip install -r requirements.txt
